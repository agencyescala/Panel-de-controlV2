<style>
/* ── TOKENS ─────────────────────────────────────────────── */
:root {
  --bg:       #080808;
  --bg1:      #0e0e0e;
  --bg2:      #141414;
  --bg3:      #1c1c1c;
  --bg4:      #252525;
  --line:     rgba(255,255,255,0.06);
  --line2:    rgba(255,255,255,0.1);
  --w100:     #f5f1eb;
  --w80:      #c8c3bb;
  --w50:      #888480;
  --w30:      #555250;
  --w15:      #2a2927;
  --gold:     #C9A84C;
  --gold2:    #E8C96A;
  --gold-bg:  rgba(201,168,76,0.08);
  --gold-bdr: rgba(201,168,76,0.18);
  --green:    #3ecf72;
  --green-bg: rgba(62,207,114,0.08);
  --amber:    #f59e0b;
  --amber-bg: rgba(245,158,11,0.08);
  --red:      #ef4444;
  --red-bg:   rgba(239,68,68,0.08);
  --blue:     #6b9fff;
  --sidebar:  228px;
  --radius:   4px;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--w100);font-family:'Barlow',sans-serif;font-size:14px;line-height:1.5;overflow:hidden;}

/* ── SCROLLBAR ───────────────────────────────────────────── */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px;}

/* ══════════════════════════════════════════════════════════
   LOGIN
══════════════════════════════════════════════════════════ */
#login-screen {
  position:fixed;inset:0;z-index:1000;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:0;
}

.login-bg {
  position:absolute;inset:0;overflow:hidden;
}
.login-bg::before {
  content:'';position:absolute;top:-30%;left:50%;transform:translateX(-50%);
  width:700px;height:700px;
  background:radial-gradient(circle,rgba(201,168,76,0.07) 0%,transparent 65%);
}
.login-bg::after {
  content:'';position:absolute;
  top:0;left:0;right:0;bottom:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(255,255,255,0.01) 40px,rgba(255,255,255,0.01) 41px),
             repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(255,255,255,0.01) 40px,rgba(255,255,255,0.01) 41px);
}

.login-box {
  position:relative;z-index:1;
  width:440px;max-width:calc(100vw - 40px);
  padding:48px 40px 40px;
  background:var(--bg1);
  border:1px solid var(--line2);
  animation:fadeUp .5s both;
}

.login-brand {
  text-align:center;margin-bottom:40px;
}
.login-emblem {
  width:72px;height:72px;margin:0 auto 16px;
}
.login-nombre {
  font-family:'Cinzel',serif;
  font-size:28px;font-weight:700;letter-spacing:.16em;color:var(--w100);
}
.login-sub {
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--w50);margin-top:4px;
}

.login-label {
  font-family:'Barlow Condensed',sans-serif;
  font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--w30);
  margin-bottom:12px;
}

.login-roles {
  display:flex;flex-direction:column;gap:8px;margin-bottom:32px;
}

.role-btn {
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;
  background:var(--bg2);border:1px solid var(--line);
  cursor:pointer;transition:all .18s;
  position:relative;overflow:hidden;
}
.role-btn::before {
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--gold);opacity:0;transition:.18s;
}
.role-btn:hover{border-color:var(--gold-bdr);background:var(--gold-bg);}
.role-btn:hover::before{opacity:1;}

.role-avatar {
  width:36px;height:36px;border-radius:50%;
  background:var(--bg3);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:13px;color:var(--gold);flex-shrink:0;
}
.role-avatar.emp{color:var(--w50);}

.role-info{flex:1;}
.role-name{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.role-desc{font-size:11px;color:var(--w50);margin-top:1px;letter-spacing:.02em;}

.role-tag {
  font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:2px;
}
.tag-admin{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-bdr);}
.tag-emp  {background:var(--bg4);color:var(--w50);border:1px solid var(--line);}

.login-footer {
  text-align:center;
  font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--w30);
}
.login-footer span{color:var(--gold);}

/* ══════════════════════════════════════════════════════════
   APP LAYOUT
══════════════════════════════════════════════════════════ */
#app{display:none;height:100vh;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:1fr;}

/* ── SIDEBAR ─────────────────────────────────────────────── */
.sidebar{
  background:var(--bg1);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
.sidebar::before{
  content:'';position:absolute;top:0;left:0;right:0;height:220px;
  background:radial-gradient(ellipse at top left,rgba(201,168,76,0.05) 0%,transparent 70%);
  pointer-events:none;
}

.sb-brand{
  padding:24px 18px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
}
.sb-emblem{width:42px;height:42px;flex-shrink:0;}
.sb-name{font-family:'Cinzel',serif;font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--w100);}
.sb-sub{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--w30);margin-top:2px;}

.sb-nav{flex:1;padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}

.nav-section{
  font-family:'Barlow Condensed',sans-serif;
  font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--w30);
  padding:12px 10px 6px;
}

.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-radius:var(--radius);cursor:pointer;transition:all .15s;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--w50);border:1px solid transparent;position:relative;
}
.nav-item:hover{color:var(--w80);background:var(--bg2);}
.nav-item.active{color:var(--gold);background:var(--gold-bg);border-color:var(--gold-bdr);}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:0;bottom:0;width:2px;background:var(--gold);}

.nav-ico{width:15px;height:15px;flex-shrink:0;opacity:.7;}
.nav-badge{margin-left:auto;background:var(--gold);color:#000;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;letter-spacing:.04em;}
.nav-badge.alert{background:var(--red);}

.sb-user{
  padding:14px 18px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.sb-avatar{
  width:32px;height:32px;border-radius:50%;background:var(--bg3);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:11px;color:var(--gold);flex-shrink:0;
}
.sb-avatar.emp{color:var(--w50);}
.sb-uname{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--w80);}
.sb-urole{font-size:10px;color:var(--w30);}

/* ── MAIN ────────────────────────────────────────────────── */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}

/* TOPBAR */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;border-bottom:1px solid var(--line);
  background:var(--bg);flex-shrink:0;
}
.tb-left{display:flex;flex-direction:column;gap:2px;}
.tb-title{font-family:'Cinzel',serif;font-size:16px;font-weight:600;letter-spacing:.06em;}
.tb-sub{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--w50);}

.tb-right{display:flex;align-items:center;gap:12px;}

.live-pill{
  display:flex;align-items:center;gap:6px;padding:4px 12px;
  border:1px solid rgba(62,207,114,0.2);background:var(--green-bg);
  border-radius:20px;
  font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite;}

.btn-primary{
  display:flex;align-items:center;gap:6px;
  padding:7px 16px;background:var(--gold);color:#000;border:none;border-radius:var(--radius);
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  cursor:pointer;transition:.15s;
}
.btn-primary:hover{background:var(--gold2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(201,168,76,0.2);}

.btn-ghost{
  padding:7px 14px;background:transparent;color:var(--w50);border:1px solid var(--line2);border-radius:var(--radius);
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;transition:.15s;
}
.btn-ghost:hover{color:var(--w80);border-color:var(--line2);}

.btn-logout{
  padding:6px 12px;background:transparent;color:var(--w30);border:1px solid var(--line);border-radius:var(--radius);
  font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;transition:.15s;
}
.btn-logout:hover{color:var(--red);border-color:rgba(239,68,68,0.3);}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:20px;}

/* ── CARDS & PANELS ──────────────────────────────────────── */
.card{background:var(--bg1);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.card-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:1px solid var(--line);background:var(--bg2);
}
.card-title{font-family:'Cinzel',serif;font-size:12px;font-weight:600;letter-spacing:.1em;}
.card-meta{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--w30);}

/* ── KPI GRID ────────────────────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.kpi{
  background:var(--bg1);border:1px solid var(--line);padding:20px;
  position:relative;overflow:hidden;transition:border-color .2s;
  animation:fadeUp .45s both;
}
.kpi:hover{border-color:var(--gold-bdr);}
.kpi::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0;transition:.3s;
}
.kpi:hover::after{opacity:1;}
.kpi:nth-child(1){animation-delay:.05s}
.kpi:nth-child(2){animation-delay:.1s}
.kpi:nth-child(3){animation-delay:.15s}
.kpi:nth-child(4){animation-delay:.2s}
.kpi-ico{width:32px;height:32px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.kpi-lbl{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--w50);margin-bottom:6px;}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:900;line-height:1;letter-spacing:-.5px;}
.kpi-val.gold{color:var(--gold);}
.kpi-val.green{color:var(--green);}
.kpi-val.red{color:var(--red);}
.kpi-delta{display:flex;align-items:center;gap:4px;margin-top:6px;font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--green);}
.kpi-delta.muted{color:var(--w30);}
.kpi-delta.warn{color:var(--amber);}

/* ── GRID 2/3 ────────────────────────────────────────────── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid-13{display:grid;grid-template-columns:1fr 340px;gap:12px;}
.grid-31{display:grid;grid-template-columns:340px 1fr;gap:12px;}

/* ── TABLA ───────────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{
  font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--w30);padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);background:var(--bg2);white-space:nowrap;
}
tbody tr{border-bottom:1px solid rgba(255,255,255,0.03);transition:background .12s;}
tbody tr:hover{background:rgba(201,168,76,0.02);}
tbody td{padding:9px 14px;font-size:12px;vertical-align:middle;}

/* ── CHIPS / BADGES ──────────────────────────────────────── */
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:2px;font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid;white-space:nowrap;cursor:default;}
.chip-ok      {background:var(--green-bg);color:var(--green);border-color:rgba(62,207,114,.2);}
.chip-pend    {background:var(--amber-bg);color:var(--amber);border-color:rgba(245,158,11,.2);}
.chip-cancel  {background:rgba(136,136,136,.06);color:var(--w30);border-color:rgba(136,136,136,.15);}
.chip-noshow  {background:var(--red-bg);color:var(--red);border-color:rgba(239,68,68,.2);}
.chip-gold    {background:var(--gold-bg);color:var(--gold);border-color:var(--gold-bdr);}
.chip-blue    {background:rgba(107,159,255,.08);color:var(--blue);border-color:rgba(107,159,255,.2);}

.chip-ef  {color:var(--green);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;}
.chip-bz  {color:var(--blue); font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;}
.chip-tj  {color:var(--gold); font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;}

/* ── RANKING ─────────────────────────────────────────────── */
.rank-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.rank-item:last-child{border-bottom:none;}
.rank-pos{font-family:'Cinzel',serif;font-size:22px;font-weight:900;width:28px;flex-shrink:0;line-height:1;}
.rank-pos.p1{color:var(--gold);}
.rank-pos.p2{color:var(--w50);}
.rank-pos.p3{color:var(--w30);}
.rank-av{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:12px;color:var(--w80);flex-shrink:0;}
.rank-info{flex:1;}
.rank-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.rank-detail{font-size:10px;color:var(--w50);margin-top:1px;}
.rank-bar{height:2px;background:var(--line);border-radius:1px;margin-top:6px;overflow:hidden;}
.rank-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:1px;transition:width .9s cubic-bezier(.4,0,.2,1);}
.rank-total{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:var(--gold);}

/* ── AGENDA TIMELINE ─────────────────────────────────────── */
.agenda-filters{display:flex;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line);}
.filter-btn{padding:5px 12px;background:var(--bg3);border:1px solid var(--line);border-radius:2px;font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--w50);cursor:pointer;transition:.15s;}
.filter-btn:hover{border-color:var(--gold-bdr);color:var(--gold);}
.filter-btn.active{background:var(--gold-bg);border-color:var(--gold-bdr);color:var(--gold);}

.agenda-body{padding:20px;}
.agenda-fila{
  display:flex;align-items:center;gap:14px;padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,0.04);transition:background .12s;
  cursor:pointer;
}
.agenda-fila:last-child{border-bottom:none;}
.agenda-fila:hover{background:rgba(201,168,76,0.02);margin:0 -20px;padding:11px 20px;}
.af-hora{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--gold);width:52px;flex-shrink:0;}
.af-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid;}
.af-dot.ok      {background:var(--green);border-color:var(--green);}
.af-dot.pend    {background:transparent;border-color:var(--amber);}
.af-dot.cancel  {background:transparent;border-color:var(--w30);}
.af-dot.noshow  {background:var(--red);border-color:var(--red);}
.af-info{flex:1;}
.af-nombre{font-size:13px;font-weight:600;color:var(--w100);}
.af-servicio{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--w50);letter-spacing:.04em;text-transform:uppercase;margin-top:1px;}
.af-barbero{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--w30);letter-spacing:.1em;text-transform:uppercase;}
.af-precio{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--w80);}

/* ── CRM ─────────────────────────────────────────────────── */
.crm-search{
  display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);
}
.crm-search input{
  flex:1;background:var(--bg3);border:1px solid var(--line);color:var(--w80);
  font-family:'Barlow',sans-serif;font-size:13px;padding:7px 12px;outline:none;transition:.15s;border-radius:var(--radius);
}
.crm-search input:focus{border-color:var(--gold-bdr);}
.crm-search input::placeholder{color:var(--w30);}

.cliente-card{
  display:flex;align-items:center;gap:14px;padding:14px 20px;
  border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:background .12s;
}
.cliente-card:hover{background:rgba(201,168,76,0.02);}
.cc-av{width:38px;height:38px;border-radius:50%;background:var(--bg3);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:13px;color:var(--w80);flex-shrink:0;}
.cc-info{flex:1;}
.cc-nombre{font-size:13px;font-weight:600;color:var(--w100);}
.cc-meta{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--w50);letter-spacing:.04em;margin-top:2px;}
.cc-stats{display:flex;gap:20px;text-align:right;}
.cc-stat-val{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--w80);}
.cc-stat-lbl{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--w30);}

/* ── FACTURACIÓN ─────────────────────────────────────────── */
.fac-resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:20px;}
.fac-bloque{text-align:center;padding:16px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--line);}
.fac-num{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:900;color:var(--gold);}
.fac-lbl{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--w50);margin-top:4px;}

/* ── AUTOMATIZACIONES ────────────────────────────────────── */
.auto-item{
  display:flex;align-items:center;gap:14px;padding:14px 20px;
  border-bottom:1px solid rgba(255,255,255,0.04);
}
.auto-dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(62,207,114,.4);flex-shrink:0;}
.auto-dot.off{background:var(--w30);box-shadow:none;}
.auto-dot.pending{background:var(--amber);}
.auto-info{flex:1;}
.auto-titulo{font-size:13px;font-weight:600;color:var(--w100);}
.auto-desc{font-size:11px;color:var(--w50);margin-top:2px;}
.auto-stat{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--w80);text-align:right;}
.auto-stat-lbl{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--w30);}

/* ── CIERRE DÍA ──────────────────────────────────────────── */
.cierre-fila{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.cierre-fila:last-child{border-bottom:none;}
.cf-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--w50);}
.cf-val{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;}
.cf-total{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;color:var(--w100);}
.cf-sep{height:1px;background:var(--line);margin:8px 0;}

/* ── STATUS STRIP ────────────────────────────────────────── */
.status-strip{
  display:flex;gap:10px;padding:12px 28px;
  background:var(--bg1);border-top:1px solid var(--line);flex-shrink:0;
}
.status-pill{
  display:flex;align-items:center;gap:7px;padding:5px 12px;
  background:var(--bg2);border:1px solid var(--line);border-radius:2px;
  font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
}
.sp-green{color:var(--green);border-left:2px solid var(--green);}
.sp-gold {color:var(--gold); border-left:2px solid var(--gold);}
.sp-muted{color:var(--w50);  border-left:2px solid var(--w30);}
.sp-amber{color:var(--amber);border-left:2px solid var(--amber);}

/* ══════════════════════════════════════════════════════════
   MODAL ANTI NO-SHOW
══════════════════════════════════════════════════════════ */
.modal-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,0.82);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex;animation:fadeIn .25s both;}

.modal-box{
  width:480px;max-width:100%;max-height:90vh;overflow-y:auto;
  background:var(--bg1);border:1px solid var(--line2);
  animation:fadeUp .3s both;
}

.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;border-bottom:1px solid var(--line);background:var(--bg2);
}
.modal-title{font-family:'Cinzel',serif;font-size:14px;font-weight:600;letter-spacing:.08em;}
.modal-close{background:transparent;border:none;color:var(--w50);font-size:18px;cursor:pointer;padding:2px 6px;transition:.15s;line-height:1;}
.modal-close:hover{color:var(--w100);}

.modal-body{padding:24px;}

.reserva-resumen{
  background:var(--bg2);border:1px solid var(--line);padding:20px;margin-bottom:20px;
}
.rr-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.rr-row:last-child{border-bottom:none;}
.rr-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--w50);}
.rr-val{font-size:13px;font-weight:600;color:var(--w100);}
.rr-precio{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:var(--gold);}

.politica-box{
  background:rgba(201,168,76,0.05);border:1px solid var(--gold-bdr);
  padding:16px;margin-bottom:20px;
}
.politica-titulo{
  font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:6px;
}
.politica-texto{font-size:12px;color:var(--w80);line-height:1.6;}

.checkbox-row{
  display:flex;align-items:flex-start;gap:12px;margin-bottom:20px;cursor:pointer;
}
.checkbox-row input[type=checkbox]{
  width:18px;height:18px;margin-top:1px;flex-shrink:0;cursor:pointer;accent-color:var(--gold);
}
.checkbox-lbl{font-size:13px;color:var(--w80);line-height:1.5;}

.modal-footer{display:flex;gap:10px;}
.btn-confirmar{
  flex:1;padding:14px;background:var(--gold);color:#000;border:none;
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;transition:.15s;border-radius:var(--radius);
}
.btn-confirmar:hover{background:var(--gold2);}
.btn-confirmar:disabled{opacity:.4;cursor:not-allowed;}
.btn-cancelar{
  padding:14px 20px;background:transparent;color:var(--w50);border:1px solid var(--line2);
  font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;transition:.15s;border-radius:var(--radius);
}
.btn-cancelar:hover{color:var(--w100);}

/* ── TOAST ───────────────────────────────────────────────── */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:600;
  background:var(--bg1);border:1px solid var(--green);
  padding:12px 20px;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--green);display:none;animation:slideIn .3s both;
  border-left:3px solid var(--green);
}

/* ── VISTA EMPLEADO ──────────────────────────────────────── */
.emp-notice{
  background:var(--amber-bg);border:1px solid rgba(245,158,11,.2);
  border-left:3px solid var(--amber);
  padding:10px 16px;margin-bottom:16px;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);
}

/* ── GRÁFICA ─────────────────────────────────────────────── */
.chart-wrap{padding:16px 16px 10px;}

/* ── ANIMATIONS ──────────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}

/* ── PANTALLAS ───────────────────────────────────────────── */
.screen{display:none;flex-direction:column;height:100%;}
.screen.active{display:flex;animation:fadeUp .35s both;}

function chipEstado(e){
  const m={ok:'chip-ok',pend:'chip-pend',cancel:'chip-cancel',noshow:'chip-noshow'};
  const l={ok:'✓ Confirmada',pend:'⏳ Pendiente',cancel:'✕ Cancelada',noshow:'✗ No-Show'};
  return `<span class="chip ${m[e]||'chip-pend'}">${l[e]||e}</span>`;
}
function chipCliente(e){
  const m={vip:'chip-gold',recurrente:'chip-ok',nuevo:'chip-blue',inactivo:'chip-cancel',noshow:'chip-noshow'};
  const l={vip:'⭐ VIP',recurrente:'Recurrente',nuevo:'Nuevo',inactivo:'Inactivo',noshow:'Riesgo No-Show'};
  return `<span class="chip ${m[e]||'chip-pend'}">${l[e]||e}</span>`;
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}

/* ── LOGIN / LOGOUT ────────────────────────────────────── */
function login(rol, nombre, inicial, puesto){
  currentUser = {rol, nombre, inicial, puesto};

  // UI sidebar
  document.getElementById('sb-nombre').textContent = CONFIG.nombre;
  document.getElementById('sb-sub').textContent    = CONFIG.subtitulo;
  document.getElementById('sb-avatar-icon').textContent = inicial;
  document.getElementById('sb-avatar-icon').className = 'sb-avatar' + (rol==='admin'?'':' emp');
  document.getElementById('sb-uname').textContent  = nombre;
  document.getElementById('sb-urole').textContent  = puesto + (rol==='admin'?' · Propietario':'');

  // Fecha
  const n=new Date();
  const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  document.getElementById('tb-date').textContent=`${dias[n.getDay()]}, ${n.getDate()} de ${meses[n.getMonth()]} ${n.getFullYear()}`;

  // Mostrar/ocultar admin-only
  document.querySelectorAll('.admin-only').forEach(el=>{
    el.style.display = rol==='admin' ? '' : 'none';
  });

  // Mostrar app
  document.getElementById('login-screen').style.display='none';
  const app = document.getElementById('app');
  app.style.display='grid';

  renderScreen('dashboard');
  initStatusStrip();
}

function logout(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  currentUser=null;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.querySelector('[data-screen="dashboard"]').classList.add('active');
}

/* ── NAVEGACIÓN ────────────────────────────────────────── */
function navTo(screen, el){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  currentScreen=screen;
  const titles={dashboard:'Dashboard',agenda:'Agenda',clientes:'Clientes · CRM',facturacion:'Facturación',equipo:'Equipo',automatizaciones:'Automatizaciones'};
  document.getElementById('tb-title').textContent=titles[screen]||screen;
  renderScreen(screen);
}

function renderScreen(s){
  const area=document.getElementById('content-area');
  area.innerHTML='';
  const screens={
    dashboard:      renderDashboard,
    agenda:         renderAgenda,
    clientes:       renderClientes,
    facturacion:    renderFacturacion,
    equipo:         renderEquipo,
    automatizaciones: renderAutomatizaciones,
  };
  if(screens[s]) screens[s](area);
}

/* ══════════════════ DASHBOARD ══════════════════ */
function renderDashboard(area){
  const isAdmin = currentUser.rol==='admin';
  const citasHoy = MOCK.citas;
  const act = citasHoy.filter(c=>c.estado==='ok');
  const noshows = citasHoy.filter(c=>c.estado==='noshow');
  const pend = citasHoy.filter(c=>c.estado==='pend');
  const ingresos = act.reduce((s,c)=>s+c.precio+c.propina,0);

  // Filtrar por empleado si es empleado
  const misCitas = isAdmin ? act : act.filter(c=>c.barbero===currentUser.nombre);
  const misIngresos = misCitas.reduce((s,c)=>s+c.precio+c.propina,0);

  const kpis = isAdmin ? [
    { lbl:'Citas Hoy',       val:citasHoy.length,       cls:'',     delta:'↑ 2 más que ayer',   clsDelta:'',      ico:'📅' },
    { lbl:'Ingresos del Día',val:fmt(ingresos),          cls:'gold', delta:'↑ 15% vs sem. pasada',clsDelta:'',     ico:'💰' },
    { lbl:'No-Shows Hoy',    val:noshows.length,         cls:'red',  delta:`≈ ${noshows.length*22}€ perdidos`,  clsDelta:'warn',ico:'⚠️' },
    { lbl:'Pendientes',      val:pend.length,            cls:'',     delta:'Recordatorio activo', clsDelta:'muted', ico:'⏳' },
  ] : [
    { lbl:'Mis Citas Hoy',   val:misCitas.length,        cls:'',     delta:'Solo tus servicios',  clsDelta:'muted', ico:'📅' },
    { lbl:'Mis Ingresos',    val:fmt(misIngresos),        cls:'gold', delta:'Tu facturación hoy',  clsDelta:'',      ico:'💰' },
  ];

  // KPI grid
  let html = `<div class="kpi-grid" style="${!isAdmin?'grid-template-columns:1fr 1fr':''}">`; 
  kpis.forEach(k=>`${html}${html+=`
    <div class="kpi">
      <div class="kpi-ico"><span style="font-size:16px">${k.ico}</span></div>
      <div class="kpi-lbl">${k.lbl}</div>
      <div class="kpi-val ${k.cls}">${k.val}</div>
      <div class="kpi-delta ${k.clsDelta}">${k.delta}</div>
    </div>`}`);
  html += '</div>';

  if(!isAdmin){
    html = `<div class="emp-notice">Vista limitada · Solo tus datos · ${currentUser.nombre}</div>` + html;
    // Citas del empleado
    html += `<div class="card"><div class="card-header"><div class="card-title">Mis Citas de Hoy</div><div class="card-meta">${currentUser.nombre}</div></div><div class="agenda-body">`;
    MOCK.citas.filter(c=>c.barbero===currentUser.nombre).forEach(c=>{
      html+=`<div class="agenda-fila">
        <div class="af-hora">${c.hora}</div>
        <div class="af-dot ${c.estado}"></div>
        <div class="af-info"><div class="af-nombre">${c.cliente}</div><div class="af-servicio">${c.servicio}</div></div>
        ${chipEstado(c.estado)}
        <div class="af-precio">${c.precio}€</div>
      </div>`;
    });
    html += '</div></div>';
    area.innerHTML=html; return;
  }

  // Admin: mid row
  html += `<div class="grid-13">`;

  // Agenda rápida
  html += `<div class="card"><div class="card-header"><div class="card-title">Agenda de Hoy</div><div class="card-meta">${citasHoy.length} citas</div></div><div class="agenda-body">`;
  citasHoy.slice(0,7).forEach(c=>{
    html+=`<div class="agenda-fila">
      <div class="af-hora">${c.hora}</div>
      <div class="af-dot ${c.estado}"></div>
      <div class="af-info"><div class="af-nombre">${c.cliente}</div><div class="af-servicio">${c.servicio} · ${c.barbero}</div></div>
      ${chipEstado(c.estado)}
      <div class="af-precio">${c.precio}€</div>
    </div>`;
  });
  if(citasHoy.length>7) html+=`<div style="text-align:center;padding:12px 0;font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--w30);cursor:pointer" onclick="navTo('agenda',document.querySelector('[data-screen=agenda]'))">VER TODAS (${citasHoy.length}) →</div>`;
  html += '</div></div>';

  // Ranking + cierre
  html += `<div style="display:flex;flex-direction:column;gap:12px">`;

  // Ranking
  const stats={};
  ['Emilio','Andrés','Montilla'].forEach(b=>stats[b]={s:0,i:0});
  act.forEach(c=>{if(stats[c.barbero]){{stats[c.barbero].s++;stats[c.barbero].i+=c.precio+c.propina;}}});
  const sorted=Object.entries(stats).sort((a,b)=>b[1].i-a[1].i);
  const mx=Math.max(...Object.values(stats).map(s=>s.i))||1;
  const posClass=['p1','p2','p3'];

  html+=`<div class="card"><div class="card-header"><div class="card-title">Ranking Barberos</div><div class="card-meta">Hoy</div></div><div style="padding:8px 16px">`;
  sorted.forEach(([nombre,st],i)=>{
    html+=`<div class="rank-item">
      <div class="rank-pos ${posClass[i]}">${String(i+1).padStart(2,'0')}</div>
      <div class="rank-av">${nombre[0]}</div>
      <div class="rank-info">
        <div class="rank-name">${nombre}</div>
        <div class="rank-detail">${st.s} servicios</div>
        <div class="rank-bar"><div class="rank-fill" style="width:${(st.i/mx)*100}%"></div></div>
      </div>
      <div class="rank-total">${st.i}€</div>
    </div>`;
  });
  html+=`</div></div>`;

  // Cierre del día
  const ef=act.filter(c=>c.pago==='Efectivo').reduce((s,c)=>s+c.precio,0);
  const bz=act.filter(c=>c.pago==='Bizum').reduce((s,c)=>s+c.precio,0);
  const tj=act.filter(c=>c.pago==='Tarjeta').reduce((s,c)=>s+c.precio,0);
  const prop=act.reduce((s,c)=>s+c.propina,0);
  html+=`<div class="card"><div class="card-header"><div class="card-title">Cierre del Día</div><div class="card-meta">Auto · 20:00</div></div>
    <div style="padding:6px 18px 16px">
      <div class="cierre-fila"><span class="cf-lbl">Efectivo</span><span class="cf-val chip-ef">${ef}€</span></div>
      <div class="cierre-fila"><span class="cf-lbl">Bizum</span><span class="cf-val chip-bz">${bz}€</span></div>
      <div class="cierre-fila"><span class="cf-lbl">Tarjeta</span><span class="cf-val chip-tj">${tj}€</span></div>
      <div class="cierre-fila"><span class="cf-lbl">Propinas</span><span class="cf-val" style="color:var(--gold)">+${prop}€</span></div>
      <div class="cf-sep"></div>
      <div class="cierre-fila"><span class="cf-lbl" style="font-size:9px;letter-spacing:.26em">Total Bruto</span><span class="cf-total">${ingresos}€</span></div>
    </div></div>`;

  html+=`</div></div>`;

  // No-show alert
  if(noshows.length>0){
    html+=`<div class="card" style="border-color:rgba(239,68,68,.2)">
      <div class="card-header" style="background:var(--red-bg)">
        <div class="card-title" style="color:var(--red)">⚠ Alertas No-Show · ${noshows.length} esta semana</div>
        <div class="card-meta" style="color:var(--red)">~${noshows.length*22}€ perdidos estimados</div>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Cliente</th><th>Hora</th><th>Servicio</th><th>Barbero</th><th>Importe</th></tr></thead>
        <tbody>`;
    noshows.forEach(c=>{
      html+=`<tr><td>${c.cliente}</td><td>${c.hora}</td><td>${c.servicio}</td><td>${c.barbero}</td><td><span class="chip-ef">${c.precio}€</span></td></tr>`;
    });
    html+=`</tbody></table></div></div>`;
  }

  area.innerHTML=html;
}

/* ══════════════════ AGENDA ══════════════════ */
function renderAgenda(area){
  const isAdmin = currentUser.rol==='admin';
  let citas = isAdmin ? MOCK.citas : MOCK.citas.filter(c=>c.barbero===currentUser.nombre);

  const barberos = ['Todos', 'Emilio', 'Andrés', 'Montilla'];

  let html = '';
  if(!isAdmin) html+=`<div class="emp-notice">Vista limitada · Solo tus citas · ${currentUser.nombre}</div>`;

  html+=`<div class="card">`;

  // Filtros
  if(isAdmin){
    html+=`<div class="agenda-filters">`;
    barberos.forEach(b=>{
      html+=`<button class="filter-btn${agendaFiltro===b?' active':''}" onclick="filtroAgenda('${b}',this)">${b}</button>`;
    });
    html+=`</div>`;

  html+=`<div class="tbl-wrap"><table>
    <thead><tr><th>Hora</th><th>Cliente</th><th>Teléfono</th><th>Servicio</th><th>Barbero</th><th>Precio</th><th>Pago</th><th>Estado</th></tr></thead>

  const filtradas = (agendaFiltro==='Todos' || !isAdmin) ? citas : citas.filter(c=>c.barbero===agendaFiltro);

  filtradas.forEach(c=>{

      <td><span style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--gold)">${c.hora}</span></td>

      <td>${c.servicio}</td>
      <td><span style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.06em">${c.barbero}</span></td>
      <td><span class="${pc}">${c.precio}€</span></td>
      <td><span class="${pc}" style="font-size:10px">${c.pago}</span></td>
      <td>${chipEstado(c.estado)}</td>

  html+=`</tbody></table></div></div>`;

      <div class="card-title">Lista de Espera</div>
      <span class="chip chip-amber" style="font-size:10px">2 clientes esperando</span>

        <span class="chip chip-pend">En espera</span>
      </div>

  area.innerHTML=html;

/* ══════════════════ FACTURACIÓN ══════════════════ */
function renderFacturacion(area){
  const isAdmin=currentUser.rol==='admin';
  const act=MOCK.citas.filter(c=>c.estado==='ok');
  const misCitas=isAdmin?act:act.filter(c=>c.barbero===currentUser.nombre);
  const misIngresos=misCitas.reduce((s,c)=>s+c.precio+c.propina,0);

  let html='';
  if(!isAdmin) html+=`<div class="emp-notice">Vista limitada · Solo tu facturación · ${currentUser.nombre}</div>`;

  // KPI
  html+=`<div class="kpi-grid" style="${!isAdmin?'grid-template-columns:1fr 1fr':''}">`;
  if(isAdmin){
    html+=`
      <div class="kpi"><div class="kpi-lbl">Ingresos Hoy</div><div class="kpi-val gold">${fmt(act.reduce((s,c)=>s+c.precio+c.propina,0))}</div><div class="kpi-delta">Completados</div></div>
      <div class="kpi"><div class="kpi-lbl">Ingresos Mes</div><div class="kpi-val gold">${fmt(MOCK.mes.ingresos)}</div><div class="kpi-delta">↑ 12% vs mes pasado</div></div>
      <div class="kpi"><div class="kpi-lbl">Perdido en No-Shows</div><div class="kpi-val red">~${MOCK.mes.noshow_euros}€</div><div class="kpi-delta warn">Este mes</div></div>
      <div class="kpi"><div class="kpi-lbl">Ticket Medio</div><div class="kpi-val">${fmt(Math.round(act.reduce((s,c)=>s+c.precio,0)/act.length))}</div><div class="kpi-delta muted">Por servicio</div></div>`;
  } else {
    html+=`
      <div class="kpi"><div class="kpi-lbl">Mis Ingresos Hoy</div><div class="kpi-val gold">${fmt(misIngresos)}</div><div class="kpi-delta">Tus servicios</div></div>
      <div class="kpi"><div class="kpi-lbl">Mis Servicios</div><div class="kpi-val">${misCitas.length}</div><div class="kpi-delta muted">Completados hoy</div></div>`;
  }
  html+=`</div>`;

  // Tabla por barbero (solo admin)
  if(isAdmin){
    html+=`<div class="grid-2">`;
    const stats={};
    ['Emilio','Andrés','Montilla'].forEach(b=>{
      stats[b]={s:0,i:0,prop:0,ef:0,bz:0,tj:0};
    });
    act.forEach(c=>{
      if(stats[c.barbero]){
        stats[c.barbero].s++;
        stats[c.barbero].i+=c.precio;
        stats[c.barbero].prop+=c.propina;
        if(c.pago==='Efectivo') stats[c.barbero].ef+=c.precio;
        if(c.pago==='Bizum')    stats[c.barbero].bz+=c.precio;
        if(c.pago==='Tarjeta')  stats[c.barbero].tj+=c.precio;
      }
    });

    html+=`<div class="card"><div class="card-header"><div class="card-title">Por Barbero · Hoy</div></div><div class="tbl-wrap"><table>
      <thead><tr><th>Barbero</th><th>Servicios</th><th>Ingresos</th><th>Propinas</th><th>Total</th></tr></thead>
      <tbody>`;
    Object.entries(stats).sort((a,b)=>b[1].i-a[1].i).forEach(([nombre,st])=>{
      html+=`<tr>
        <td style="font-weight:600">${nombre}</td>
        <td>${st.s}</td>
        <td><span class="chip-ef">${st.i}€</span></td>
        <td><span style="color:var(--gold)">${st.prop}€</span></td>
        <td style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--w100)">${st.i+st.prop}€</td>
      </tr>`;
    });
    html+=`</tbody></table></div></div>`;

    html+=`<div class="card"><div class="card-header"><div class="card-title">Por Forma de Pago</div></div>
      <div class="fac-resumen">
        <div class="fac-bloque"><div class="fac-num" style="color:var(--green)">${act.filter(c=>c.pago==='Efectivo').reduce((s,c)=>s+c.precio,0)}€</div><div class="fac-lbl">Efectivo</div></div>
        <div class="fac-bloque"><div class="fac-num" style="color:var(--blue)">${act.filter(c=>c.pago==='Bizum').reduce((s,c)=>s+c.precio,0)}€</div><div class="fac-lbl">Bizum</div></div>
        <div class="fac-bloque"><div class="fac-num" style="color:var(--gold)">${act.filter(c=>c.pago==='Tarjeta').reduce((s,c)=>s+c.precio,0)}€</div><div class="fac-lbl">Tarjeta</div></div>
      </div>
    </div>`;
    html+=`</div>`;
  }

  area.innerHTML=html;
}

/* ══════════════════ EQUIPO ══════════════════ */
function renderEquipo(area){
  const act=MOCK.citas.filter(c=>c.estado==='ok');
  const equipo=[CONFIG.owner,...CONFIG.empleados];

  let html=`<div class="grid-2" style="grid-template-columns:repeat(${equipo.length>=3?3:equipo.length},1fr)">`;

  equipo.forEach(p=>{
    const misCitas=act.filter(c=>c.barbero===p.nombre);
    const mis$=misCitas.reduce((s,c)=>s+c.precio+c.propina,0);
    const servicios=[...new Set(misCitas.map(c=>c.servicio))];

    html+=`<div class="card">
      <div style="padding:24px;text-align:center;border-bottom:1px solid var(--line)">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--bg3);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:20px;color:var(--gold);margin:0 auto 12px">${p.inicial}</div>
        <div style="font-family:'Cinzel',serif;font-size:15px;font-weight:600;letter-spacing:.08em">${p.nombre}</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--w50);margin-top:3px">${p.rol}</div>
      </div>
      <div style="padding:16px">
        <div class="cierre-fila"><span class="cf-lbl">Servicios Hoy</span><span class="cf-val">${misCitas.length}</span></div>
        <div class="cierre-fila"><span class="cf-lbl">Facturación Hoy</span><span class="cf-val" style="color:var(--gold)">${mis$}€</span></div>
        <div class="cierre-fila"><span class="cf-lbl">Ocupación</span><span class="cf-val">${Math.round(misCitas.length/14*100)}%</span></div>
      </div>
    </div>`;
  });

  html+=`</div>`;

  // Semana
  html+=`<div class="card"><div class="card-header"><div class="card-title">Rendimiento Semanal</div><div class="card-meta">Esta semana</div></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Día</th><th>Citas</th><th>Ingresos</th><th>Tendencia</th></tr></thead>
      <tbody>`;
  MOCK.semana.forEach(d=>{
    const bar=d.citas?`<div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;width:100px"><div style="height:100%;width:${(d.citas/16)*100}%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px"></div></div>`:'<span style="color:var(--w30);font-size:10px">—</span>';
    html+=`<tr><td style="font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.06em">${d.dia}</td><td>${d.citas||'—'}</td><td>${d.ingresos?d.ingresos+'€':'—'}</td><td>${bar}</td></tr>`;
  });
  html+=`</tbody></table></div></div>`;

  area.innerHTML=html;
}

/* ══════════════════ AUTOMATIZACIONES ══════════════════ */
function renderAutomatizaciones(area){
  const autos=[
    { titulo:'Recordatorio 24h antes',      desc:'WhatsApp automático con nombre, servicio y hora',      estado:'activo',  enviados:14, confirmados:9,  icono:'📨' },
    { titulo:'Recordatorio 6h antes',       desc:'Segundo aviso si no ha confirmado la cita',             estado:'activo',  enviados:5,  confirmados:4,  icono:'⏰' },
    { titulo:'Confirmación de cita',        desc:'Mensaje de confirmación cuando el cliente responde SÍ', estado:'activo',  enviados:11, confirmados:11, icono:'✅' },
    { titulo:'Alerta de cancelación',       desc:'Notificación a barbero cuando hay cancelación',         estado:'activo',  enviados:1,  confirmados:1,  icono:'🔔' },
    { titulo:'Lista de espera',             desc:'Aviso automático cuando se libera un hueco',            estado:'activo',  enviados:2,  confirmados:1,  icono:'⏳' },
    { titulo:'Seguimiento post-corte',      desc:'Mensaje a los 21 días para reactivar cliente',          estado:'activo',  enviados:8,  confirmados:3,  icono:'🔄' },
    { titulo:'Reseña en Google',            desc:'Solicitud de reseña 2h después del servicio',           estado:'pendiente',enviados:0, confirmados:0, icono:'⭐' },
    { titulo:'Reactivación inactivos',      desc:'Flujo automático para clientes sin visita en 45 días',  estado:'pendiente',enviados:0, confirmados:0, icono:'💤' },
  ];

  const activos=autos.filter(a=>a.estado==='activo');
  const pendientes=autos.filter(a=>a.estado==='pendiente');

  let html=`
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-lbl">Automatizaciones Activas</div><div class="kpi-val green">${activos.length}</div><div class="kpi-delta">Funcionando ahora</div></div>
      <div class="kpi"><div class="kpi-lbl">Mensajes Enviados Hoy</div><div class="kpi-val">${activos.reduce((s,a)=>s+a.enviados,0)}</div><div class="kpi-delta muted">WhatsApp</div></div>
      <div class="kpi"><div class="kpi-lbl">Confirmaciones</div><div class="kpi-val green">${activos.reduce((s,a)=>s+a.confirmados,0)}</div><div class="kpi-delta">Respuestas positivas</div></div>
      <div class="kpi"><div class="kpi-lbl">Pendientes de Activar</div><div class="kpi-val">${pendientes.length}</div><div class="kpi-delta muted">Próximas fases</div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Estado del Sistema</div><div class="card-meta">N8N · WhatsApp Business</div></div>`;

  autos.forEach(a=>{
    html+=`<div class="auto-item">
      <div class="auto-dot ${a.estado==='activo'?'':'pending'}"></div>
      <span style="font-size:18px;flex-shrink:0">${a.icono}</span>
      <div class="auto-info">
        <div class="auto-titulo">${a.titulo}</div>
        <div class="auto-desc">${a.desc}</div>
      </div>
      <div style="text-align:right">
        <div class="auto-stat">${a.enviados}</div>
        <div class="auto-stat-lbl">Enviados</div>
      </div>
      <div style="text-align:right;margin-left:16px">
        ${a.estado==='activo'
          ? `<span class="chip chip-ok">Activo</span>`
          : `<span class="chip chip-pend">Pendiente</span>`}
      </div>
    </div>`;
  });

  html+=`</div>
    <div class="card" style="border-color:var(--gold-bdr)">
      <div class="card-header" style="background:var(--gold-bg)">
        <div class="card-title" style="color:var(--gold)">Impacto Estimado del Sistema</div>
      </div>
      <div style="padding:20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;text-align:center">
        <div><div style="font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:900;color:var(--green)">~70%</div><div style="font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--w50)">Reducción No-Shows</div></div>
        <div><div style="font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:900;color:var(--gold)">~140€</div><div style="font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--w50)">Recuperado/Mes</div></div>
        <div><div style="font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:900;color:var(--w100)">Mes 1</div><div style="font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--w50)">Setup Amortizado</div></div>
      </div>
    </div>`;

  area.innerHTML=html;
}

/* ══════════════════ MODAL ANTI NO-SHOW ══════════════════ */
function openModal(){
  const s = CONFIG.servicios[1];
  document.getElementById('m-servicio').textContent = s.nombre;
  document.getElementById('m-barbero').textContent  = CONFIG.owner.nombre;
  document.getElementById('m-fecha').textContent    = 'Viernes, 10 de mayo';
  document.getElementById('m-hora').textContent     = '17:30';
  document.getElementById('m-precio').textContent   = s.precio+'€';
  document.getElementById('m-politica').textContent = CONFIG.politicaTexto;
  document.getElementById('acepto-politica').checked = false;
  document.getElementById('btn-confirmar').disabled = true;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
}

function toggleConfirmar(){
  document.getElementById('btn-confirmar').disabled =
    !document.getElementById('acepto-politica').checked;
}

function confirmarCita(){
  closeModal();
  toast('✓ Cita confirmada · Recordatorio programado para 24h y 6h antes');
}
